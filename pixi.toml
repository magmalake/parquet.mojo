[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "parquet.mojo"
version = "0.4.2"
description = "Native pure-Mojo Apache Parquet — footer, pages, every encoding, and Arrow output over the C Data Interface."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

# Sibling magmalake tins are consumed by *source path* (`-I ../x.mojo/src`),
# never as built `.mojopkg`: pixi-build-mojo emits a package compiled with
# mojo-compiler 1.0.0 and the nightly compiler refuses to load it. CI checks
# each sibling out next to this repository.
[tasks]
# macOS wants .dylib, Linux .so; the shared-library tasks read $SHLIB_EXT.
test = { cmd = "mkdir -p build && mojo build tests/test_parquet.mojo -I src -I tests -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -o build/parquet-test && ./build/parquet-test" }
# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
# `src/parquet/ext_full.mojo` imports zstd/lz4/brotli, which are not on this
# -I list, so mojolint reports one expected `note:` and falls back to text
# mode for that file; `lint-codecs` (below) resolves it fully. `tests` also
# holds `test_codecs.mojo` (same missing imports) and the rest of `tests/`,
# `src` all clean.
lint = { cmd = "mojolint --lsp -I src -I tests -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src src tests" }
# tools/write_fixtures.mojo imports tests/fixtures_list.mojo, hence -I tests;
# tools/conformance.mojo imports parquet.ext_full (zstd/lz4/brotli, missing
# here too) but `lint-codecs` covers it fully — see the same note on `lint`.
lint-tools = { cmd = "mojolint --lsp -I src -I tests -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src tools" }
check = { depends-on = ["test", "cli", "lint", "lint-tools"] }
cli = { cmd = "mkdir -p build && mojo build src/main.mojo -I src -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -o build/parquet-mojo" }
profile = { cmd = "mkdir -p build && mojo build bench/profile_parquet.mojo -I src -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -o build/parquet-profile && ./build/parquet-profile" }
fmt = { cmd = "mojo format src tests bench" }
# `mojo format` has no check mode in 1.0.0 — it rejects `--check` outright — so
# the check is: format, then assert the tree did not move. It rewrites the files
# as a side effect, which is what CI wants and is harmless locally; run it with
# your own work committed or stashed.
format-check = { cmd = "mojo format src tests bench && git diff --exit-code -- src tests bench" }
# Regenerate tests/fixtures/*.parquet and their pyarrow oracles (needs `uv`).
fixtures = { cmd = "bash tools/gen_fixtures.sh" }
# Build the Arrow C Data Interface shared library and import it into pyarrow.
carrow-lib = { cmd = "mkdir -p build && mojo build --emit shared-lib tools/carrow_export.mojo -I src -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -o build/libpqcarrow$SHLIB_EXT" }
verify-c = { cmd = "bash tools/verify_c_data.sh", depends-on = ["carrow-lib"] }
# Write every fixture back out through our writer and have pyarrow read it.
verify-written = { cmd = "bash tools/verify_written.sh" }
# pyarrow's numbers for the same files, for the README's honesty.
bench-pyarrow = { cmd = "bash tools/bench_pyarrow.sh" }

# The ZSTD / LZ4 codecs are FFI tins, so they live in their own environments:
# `pixi run -e codecs test-codecs` (nightly) and `-e codecs-stable` (1.0.0).
[feature.codecs.tasks]
conformance = { cmd = "mkdir -p build && mojo build tools/conformance.mojo -I src -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -o build/parquet-conformance && ./build/parquet-conformance" }
test-codecs = { cmd = "mkdir -p build && mojo build tests/test_codecs.mojo -I src -I tests -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src -o build/parquet-codecs-test && ./build/parquet-codecs-test" }
# The three files `lint` and `lint-tools` can only text-mode-fallback on
# (they import zstd/lz4/brotli): resolved fully here, with the codecs env's
# sibling checkouts on the path.
lint-codecs = { cmd = "mojolint --lsp -I src -I tests -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -I ../zstd.mojo/src -I ../lz4.mojo/src -I ../brotli.mojo/src src/parquet/ext_full.mojo tests/test_codecs.mojo tools/conformance.mojo" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is parquet-mojo; the Mojo import stays `from parquet import …`.
[package]
name = "parquet-mojo"
version = "0.4.2"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/parquet"
name = "parquet"
# The sibling tins arrive as .mojopkg in the host prefix; pixi-build-mojo does
# not add them to the import path on its own.
extra-args = ["-I", "$PREFIX/lib/mojo"]

[package.host-dependencies]
mojo-compiler = "==1.0.0"
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "f4c3bdddd0c06bbad0c49c2b05c7afc30e7aa67a" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo", rev = "6d56cd46c56273051f166d33f50fdf194a8dcd3e" }
snappy-mojo = { git = "https://github.com/magmalake/snappy.mojo", rev = "33cad1faf0427543ed0142bbf1ffe7e41833a62a" }
avro-mojo = { git = "https://github.com/magmalake/avro.mojo", rev = "589f3893627ee4263c756f679369c1b3f3ca5f7c" }

zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "2088700111339559978ea592c56eb55e75757346" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "36ec6c5ca1cef06c970db67710e072fd64849be7" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "bddf7c6811e756a4924fb13c7e9c14041644429a" }
[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "f4c3bdddd0c06bbad0c49c2b05c7afc30e7aa67a" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo", rev = "6d56cd46c56273051f166d33f50fdf194a8dcd3e" }
snappy-mojo = { git = "https://github.com/magmalake/snappy.mojo", rev = "33cad1faf0427543ed0142bbf1ffe7e41833a62a" }
avro-mojo = { git = "https://github.com/magmalake/avro.mojo", rev = "589f3893627ee4263c756f679369c1b3f3ca5f7c" }

zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "2088700111339559978ea592c56eb55e75757346" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "36ec6c5ca1cef06c970db67710e072fd64849be7" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "bddf7c6811e756a4924fb13c7e9c14041644429a" }
[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

# ── optional codecs ─────────────────────────────────────────────────────────
# ZSTD, BROTLI and LZ4 are FFI tins; these git source dependencies are what put
# libzstd / libbrotli / liblz4 and their dlopen shims into the environment. The
# Mojo code still comes from `-I ../zstd.mojo/src -I ../brotli.mojo/src
# -I ../lz4.mojo/src` because the shipped packages are built with stable 1.0.0
# and nightly cannot load them. Path dependencies would break `pixi install`
# for a bare clone, since pixi solves every environment even when it installs
# one.
[feature.codecs.dependencies]
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo" }

[target.osx-arm64.activation.env]
SHLIB_EXT = ".dylib"

[target.linux-64.activation.env]
SHLIB_EXT = ".so"

# Benchmarks run through the shared harness (magmalake/bench.mojo) and get
# their own feature, so the tin stays out of the environments that run tests.
# -I $CONDA_PREFIX/lib/mojo is what puts its precompiled package on the import
# path. Stable only: a precompiled Mojo package is stamped with the compiler
# version that built it and refused by any other, and tins build with 1.0.0.
# Benchmarks consume the sibling tins as *tins*, not as source paths. They can,
# because this environment is stable-only: the package pixi-build-mojo emits is
# built with mojo-compiler 1.0.0 and loads fine here. The test, cli and profile
# tasks still use `-I ../x.mojo/src` because they also run on nightly, which
# refuses that package — see the note at the top of this file.
[feature.bench.dependencies]
bench-mojo = { git = "https://github.com/magmalake/bench.mojo", rev = "971759f58b862cfaa8fdef8708cd42f52ac719f9" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "f4c3bdddd0c06bbad0c49c2b05c7afc30e7aa67a" }
hashes-mojo = { git = "https://github.com/magmalake/hashes.mojo", rev = "6d56cd46c56273051f166d33f50fdf194a8dcd3e" }
snappy-mojo = { git = "https://github.com/magmalake/snappy.mojo", rev = "33cad1faf0427543ed0142bbf1ffe7e41833a62a" }
avro-mojo = { git = "https://github.com/magmalake/avro.mojo", rev = "589f3893627ee4263c756f679369c1b3f3ca5f7c" }

[feature.bench.tasks]
bench = "mojo run -I src -I $CONDA_PREFIX/lib/mojo bench/bench_parquet.mojo"
# bench/ imports the shared harness and the sibling tins by source path
# (mojolint needs real sources to resolve, not the precompiled packages the
# dependencies above install into $CONDA_PREFIX/lib/mojo).
lint-bench = { cmd = "mojolint --lsp -I src -I ../thrift.mojo/src -I ../hashes.mojo/src -I ../snappy.mojo/src -I ../avro.mojo/src -I ../bench.mojo/src bench" }

[environments]
default = ["nightly"]
stable = ["stable"]
codecs = ["nightly", "codecs"]
codecs-stable = ["stable", "codecs"]
bench = ["stable", "bench"]

[dependencies]
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "3fa66644756c1de7aece83e5a89375323b6e0ce7" }
