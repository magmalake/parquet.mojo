# parquet-full-mojo: the codecs that need FFI, as a tin of their own.
#
# A second package in the same repository, published from this directory. The
# root tin — parquet-mojo — reads and writes Parquet with UNCOMPRESSED, SNAPPY
# and GZIP and links no third-party C at all; this one adds ZSTD, BROTLI,
# LZ4_RAW and the legacy Hadoop-framed LZ4, which means libzstd, libbrotli and
# liblz4 and the three cmake shims that dlopen them.
#
# Consumers pick: `pixi shelf add parquet-mojo` for the minimal reader,
# `pixi shelf add parquet-full-mojo` for every codec the spec defines. Nothing
# else about the split is visible — `from parquet import ParquetReader` is the
# same import either way.
#
# There is no [workspace] here on purpose: this manifest is a package inside
# the repo's workspace, the same shape zstd.mojo/shim uses.
[package]
name = "parquet-full-mojo"
version = "0.1.4"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
# Relative to THIS directory — a subdirectory manifest's build context is the
# subdirectory, so this is full/src/parquet_full.
path = "src/parquet_full"
name = "parquet_full"
# The sibling tins arrive as .mojopkg in the host prefix; pixi-build-mojo does
# not add them to the import path on its own.
extra-args = ["-I", "$PREFIX/lib/mojo"]

[package.host-dependencies]
mojo-compiler = "==1.2.0"
# The root package of this same repository, at the commit being built. A path
# inside the repo resolves for every consumer, and the two tins never need
# re-pinning against each other.
parquet-mojo = { path = ".." }
# Imported directly by src/parquet_full: every sibling a package uses has to be
# declared, not inherited through parquet-mojo.
snappy-mojo = { git = "https://github.com/magmalake/snappy.mojo", rev = "8b0e448c842c713b65a6ad5b86ec2193cc12d48b" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "fa96c233d299180799916f3aba1c6e4c05231ebc" }
# The reason this tin exists: three dlopen'd C libraries.
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "c468fa2378d999753968288f3de33d904d5bb701" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "5e0b29831ec292daac2ef8226d28a959288b66ae" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "0ba0e088d382d28036006968bcb015eaccacdd6e" }

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = ">=1.2.0,<2"
parquet-mojo = { path = ".." }
snappy-mojo = { git = "https://github.com/magmalake/snappy.mojo", rev = "8b0e448c842c713b65a6ad5b86ec2193cc12d48b" }
thrift-mojo = { git = "https://github.com/magmalake/thrift.mojo", rev = "fa96c233d299180799916f3aba1c6e4c05231ebc" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "c468fa2378d999753968288f3de33d904d5bb701" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "5e0b29831ec292daac2ef8226d28a959288b66ae" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "0ba0e088d382d28036006968bcb015eaccacdd6e" }
