# Benchmarks, and the history behind
# https://magmalake.github.io/parquet.mojo/benchmarks/
#
# The pipeline lives in magmalake/.github so every tin shares one copy: it runs
# `pixi run -e bench bench`, folds the report into this repo's gh-pages history,
# and republishes the dashboard. Pull requests run the benchmarks and publish
# nothing.
#
# Two things are specific to this repo.
#
# The bench task takes its Mojo sources for thrift, hashes, snappy and avro
# from checkouts next door, the same way ci.yml does — a shipped .mojopkg is
# stamped with the compiler that built it, so the source is what travels. The
# setup step below puts them there.
#
# The wide benchmarks are skipped: they need build/bench-wide.parquet, which
# `tools/bench_pyarrow.py --make` generates and which is deliberately not
# committed. Run them locally for the 1M-row numbers.
name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    uses: magmalake/.github/.github/workflows/bench-report.yml@main
    permissions:
      contents: write
    with:
      args: "--skip bench_read_wide bench_write_wide"
      setup: |
        for tin in thrift hashes snappy avro; do
          git clone --depth 1 -q "https://github.com/magmalake/$tin.mojo" "../$tin.mojo"
        done
