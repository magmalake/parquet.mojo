name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true
      tools-ref: "release-check"

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      # The unit tests run in the stable / ubuntu-latest job below.
      task: ""
      tools-ref: "release-check"

  test:
    needs: release
    if: ${{ !cancelled() }}
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        env: [default, stable]
    steps:
      # Sibling magmalake tins are consumed by source path (`-I ../x.mojo/src`),
      # so CI has to lay them out next to this repository.
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/arrow-mlake.mojo
          path: arrow-mlake.mojo

      # arrow-mlake builds its C Data Interface export in a memory region, so
      # the tin has to be on the include path wherever arrow-mlake is.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          path: memory-region.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects the committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Unit tests, CLI build, and lint (mojolint --lsp)
        working-directory: parquet.mojo
        # `check` depends on `lint` (src, tests) and `lint-tools` (tools).
        # `src` is the core package alone — the FFI codecs are the separate
        # parquet-full-mojo package under `full/` — so `lint` only falls back
        # to text mode on `tests/test_codecs.mojo`, which imports them.
        # `lint-codecs` in the codecs job below resolves that and `full/`
        # fully, with the sibling checkouts for it.
        run: pixi run -e ${{ matrix.env }} check

      # `mojo format` runs in its own environment, on one leg. The 1.0.0 formatter aborts
      # with `'_python_symbols' object has no attribute
      # 'old_comptime_assert_stmt'` on thirteen of this repo's files — a
      # toolchain defect, not a formatting one: the same files come back
      # unchanged from a nightly at or after 26.6.0.dev2026090705, which is
      # what the `fmt` environment resolves. It is a separate environment on
      # purpose: the build environments are capped below dev2026090105 because
      # threads.mojo does not compile above it, and `mojo format` only parses,
      # so the formatter can move ahead of the compiler that has to agree with
      # the siblings. Stable 1.2.0 no longer carries the bug: it leaves all 31 files unchanged too.
      - name: Format check
        if: matrix.env == 'default'
        working-directory: parquet.mojo
        run: pixi run -e fmt format-check

      # The threaded read path under load: the same fixtures read over and
      # over at 2, 4, 8 and 10 workers, with a watchdog, so a hung join or an
      # answer that depends on which worker won fails here rather than in
      # somebody's pipeline. Stable only — it is a property of the code, not
      # of the compiler, and running it twice per OS buys nothing.
      - name: Threaded read stress
        if: matrix.env == 'stable'
        working-directory: parquet.mojo
        run: pixi run -e stable stress

      - name: CLI smoke
        working-directory: parquet.mojo
        run: |
          ./build/parquet-mojo schema tests/fixtures/nested.parquet
          ./build/parquet-mojo meta tests/fixtures/pageindex.parquet
          ./build/parquet-mojo cat tests/fixtures/primitives.parquet --limit 3
          ./build/parquet-mojo cat tests/fixtures/fieldids.parquet --columns id,name --json

  codecs:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    # ZSTD, BROTLI and LZ4 are FFI tins: the pixi git source dependencies
    # install libzstd / libbrotli / liblz4 and their dlopen shims, while the
    # Mojo sources come from the checkouts next door. Stable only: the source
    # build also drops a `.mojoc` compiled with 1.2.0 into the environment,
    # and a nightly compiler refuses to load it (`codecs` stays in pixi.toml
    # for local use with a matching compiler).
    name: codecs stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [codecs-stable]
    steps:
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/arrow-mlake.mojo
          path: arrow-mlake.mojo

      # arrow-mlake builds its C Data Interface export in a memory region, so
      # the tin has to be on the include path wherever arrow-mlake is.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          path: memory-region.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/zstd.mojo
          path: zstd.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/lz4.mojo
          path: lz4.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/brotli.mojo
          path: brotli.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Codec tests
        working-directory: parquet.mojo
        run: pixi run -e ${{ matrix.env }} test-codecs

      - name: Codec lint (mojolint --lsp)
        working-directory: parquet.mojo
        run: pixi run -e ${{ matrix.env }} lint-codecs

  lint-bench:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    # bench/ imports the shared harness (magmalake/bench.mojo) and the
    # sibling tins by source path, so linting it needs all of them checked
    # out next door — mojolint needs real sources, not the precompiled
    # packages the `bench` environment installs for the actual `bench` task.
    name: lint bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/arrow-mlake.mojo
          path: arrow-mlake.mojo

      # arrow-mlake builds its C Data Interface export in a memory region, so
      # the tin has to be on the include path wherever arrow-mlake is.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          path: memory-region.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/bench.mojo
          path: bench.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: bench

      - name: Lint bench (mojolint --lsp)
        working-directory: parquet.mojo
        run: pixi run -e bench lint-bench

  parity:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    # The two cross-language checks: pyarrow importing our Arrow C Data
    # Interface export, and pyarrow reading files our writer produced. The
    # third — pyarrow *producing* arrays that we import — went to
    # arrow-mlake.mojo with the import side itself.
    name: pyarrow parity / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/arrow-mlake.mojo
          path: arrow-mlake.mojo

      # arrow-mlake builds its C Data Interface export in a memory region, so
      # the tin has to be on the include path wherever arrow-mlake is.
      - uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          path: memory-region.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: default

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Arrow C Data Interface into pyarrow
        working-directory: parquet.mojo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run verify-c

      - name: pyarrow reads what our writer writes
        working-directory: parquet.mojo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run verify-written

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() }}
    needs: [release, release-check, test, codecs, lint-bench, parity]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
