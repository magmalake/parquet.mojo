name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      # Sibling magmalake tins are consumed by source path (`-I ../x.mojo/src`),
      # so CI has to lay them out next to this repository.
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects the committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Unit tests, CLI build, and lint (mojolint --lsp)
        working-directory: parquet.mojo
        # `check` now depends on `lint` (src, tests) and `lint-tools` (tools);
        # `lint` falls back to text mode with one expected `note:` on
        # `src/parquet/ext_full.mojo` (imports zstd/lz4/brotli, not on this
        # -I list) — resolved fully by `lint-codecs` in the codecs job below,
        # which has the sibling checkouts for it.
        run: pixi run -e ${{ matrix.env }} check

      # The threaded read path under load: the same fixtures read over and
      # over at 2, 4, 8 and 10 workers, with a watchdog, so a hung join or an
      # answer that depends on which worker won fails here rather than in
      # somebody's pipeline. Stable only — it is a property of the code, not
      # of the compiler, and running it twice per OS buys nothing.
      - name: Threaded read stress
        if: matrix.env == 'stable'
        working-directory: parquet.mojo
        run: pixi run -e stable stress

      - name: CLI smoke
        working-directory: parquet.mojo
        run: |
          ./build/parquet-mojo schema tests/fixtures/nested.parquet
          ./build/parquet-mojo meta tests/fixtures/pageindex.parquet
          ./build/parquet-mojo cat tests/fixtures/primitives.parquet --limit 3
          ./build/parquet-mojo cat tests/fixtures/fieldids.parquet --columns id,name --json

  codecs:
    # ZSTD, BROTLI and LZ4 are FFI tins: the pixi git source dependencies
    # install libzstd / libbrotli / liblz4 and their dlopen shims, while the
    # Mojo sources come from the checkouts next door. Stable only: the source
    # build also drops a `.mojoc` compiled with 1.0.0 into the environment,
    # and a nightly compiler refuses to load it (`codecs` stays in pixi.toml
    # for local use with a matching compiler).
    name: codecs stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [codecs-stable]
    steps:
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/zstd.mojo
          path: zstd.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/lz4.mojo
          path: lz4.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/brotli.mojo
          path: brotli.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Codec tests
        working-directory: parquet.mojo
        run: pixi run -e ${{ matrix.env }} test-codecs

      - name: Codec lint (mojolint --lsp)
        working-directory: parquet.mojo
        run: pixi run -e ${{ matrix.env }} lint-codecs

  lint-bench:
    # bench/ imports the shared harness (magmalake/bench.mojo) and the
    # sibling tins by source path, so linting it needs all of them checked
    # out next door — mojolint needs real sources, not the precompiled
    # packages the `bench` environment installs for the actual `bench` task.
    name: lint bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/bench.mojo
          path: bench.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: bench

      - name: Lint bench (mojolint --lsp)
        working-directory: parquet.mojo
        run: pixi run -e bench lint-bench

  parity:
    # The two cross-language checks: pyarrow importing our Arrow C Data
    # Interface export, and pyarrow reading files our writer produced.
    name: pyarrow parity / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: parquet.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/threads.mojo
          path: threads.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/thrift.mojo
          path: thrift.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/hashes.mojo
          path: hashes.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo
      - uses: actions/checkout@v4
        with:
          repository: magmalake/avro.mojo
          path: avro.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: parquet.mojo/pixi.toml
          environments: default

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Arrow C Data Interface into pyarrow
        working-directory: parquet.mojo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run verify-c

      - name: pyarrow reads what our writer writes
        working-directory: parquet.mojo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run verify-written
